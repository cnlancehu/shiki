[workspace]
resolver = "3"
members = [
    "shiki",
    "shiki-langs",
    "shiki-macros",
    "shiki-themes",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.0.7"
repository = "https://github.com/cnlancehu/shiki"
keywords = ["highlighting", "syntax"]

[workspace.dependencies]
onig_sys = { version = "69.9.3", default-features = false }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
lz4_flex = { version = "0.14.0" }
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn = { version = "3.0.2", features = ["full"] }

shiki = { version = "0.0.7", path = "shiki", default-features = false }
shiki-langs = { version = "0.0.7", path = "shiki-langs" }
shiki-macros = { version = "0.0.7", path = "shiki-macros" }
shiki-themes = { version = "0.0.7", path = "shiki-themes" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
